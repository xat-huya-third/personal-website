<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthodox</title>
    <style>
        :root {
            --background: #f4f5f2;
            --surface: #ffffff;
            --border: #e3e6e1;
            --text: #1d2723;
            --text-soft: #69736f;
            --green: #31584b;
            --green-dark: #24463c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--background);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .language-page {
            width: min(30rem, 90%);
            padding: 2.5rem;
            background: var(--surface);
            border: 0.0625rem solid var(--border);
            border-radius: 1.25rem;
            box-shadow: 0 0.75rem 2.5rem rgba(26, 38, 33, 0.06);
            text-align: center;
        }

        .logo {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            display: grid;
            place-items: center;
            border-radius: 1rem;
            background: var(--green);
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
        }

        p {
            margin: 0 0 1.75rem;
            color: var(--text-soft);
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .languages a {
            padding: 0.9rem 1rem;
            border: 0.0625rem solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .languages a:hover {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
    </style>
</head>
<body>
    <main class="language-page">
        <div class="logo">O</div>

        <h1>Orthodox</h1>
        <p>Select your language</p>

        <nav class="languages">
            <a href="./EN/">EN</a>
            <a href="./RU/">RU</a>
            <a href="./SP/">SP</a>
            <a href="./BR/">BR</a>
        </nav>
    </main>

    <script>
        const language = navigator.language.toLowerCase();
        if (language.startsWith("ru")) {
            window.location.href = "./RU/";
        } else if (language.startsWith("es")) {
            window.location.href = "./SP/";
        } else if (language.startsWith("pt")) {
            window.location.href = "./BR/";
	} else {
            window.location.href = "./EN/";
	}
    </script>
</body>
</html>
